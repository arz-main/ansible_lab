---
# Politica implicita: tot ce nu e permis explicit e blocat
firewall_default_incoming: deny
firewall_default_outgoing: allow

# Portul SSH, trebuie sa corespunda cu ssh_port din rolul ssh_hardening
firewall_ssh_port: 22

# Reguli explicite suplimentare, o lista de porturi/servicii permise
# proto: tcp/udp, port: numar sau nume serviciu, comment: descriere
firewall_allowed_rules:
  - { proto: tcp, port: "80", comment: "HTTP" }
  - { proto: tcp, port: "443", comment: "HTTPS" }

# Limitare optionala pentru portul SSH, impotriva brute-force
firewall_ssh_rate_limit: true
