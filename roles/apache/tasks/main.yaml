- name: install web server
  ansible.builtin.package:
    name: apache2
    state: latest

- name: server config file
  ansible.builtin.template:
    src: apache2.j2
    dest: /etc/apache2/apache2.conf
  notify: restart apache service

- name: testing db config template
  ansible.builtin.template:
    src: db_config.j2
    dest: /etc/apache2/db_config.conf
    mode: "0600"
  notify: restart apache service

- name: deploy vhost config file
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: /etc/apache2/sites-available/vhost.conf
  notify: restart apache service

- name: enable vhost site
  ansible.builtin.command: a2ensite vhost.conf
  notify: restart apache service

- name: enable and start the service
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: create a static html page with custom value
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
